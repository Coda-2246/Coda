<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found | Coda</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f5f3ee;
        color: #252e4b;
        font-family: Arial, sans-serif;
      }

      main {
        width: 100%;
        max-width: 620px;
        padding: 64px 40px;
        text-align: center;
        background: white;
        border-radius: 28px;
        box-shadow: 0 18px 45px rgba(37, 46, 75, 0.12);
      }

      .code {
        width: 100%;
        max-width: none;
        margin: 0 0 12px;
        color: #4f8a68;
        font-size: 88px;
        font-weight: 800;
        line-height: 1;
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 36px;
      }

      p {
        margin: 0 auto 32px;
        max-width: 440px;
        color: #666b78;
        font-size: 18px;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 12px;
        background: #252e4b;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: #182039;
      }
    </style>
  </head>

  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you’re looking for doesn’t exist or may have been moved.</p>
      <a href="/">Back to Coda</a>
    </main>
  </body>
</html>
